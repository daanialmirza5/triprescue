name: Keep Backend Alive

on:
  schedule:
    # 09:30-23:30 IST only. Render's free tier shares 750 instance-hours a month across all
    # free services; pinging around the clock used nearly all of them for this one backend.
    - cron: "*/10 4-17 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://triprescue-kw9d.onrender.com/api/health || \
          echo "Ping failed or backend was cold-starting (non-fatal)."

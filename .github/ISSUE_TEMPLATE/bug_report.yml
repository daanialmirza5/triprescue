name: "Bug Report"
description: "File a bug report for TripRescue"
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: "e.g., Applying recovery option #2 on multi-hop itinerary causes circular edge error..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the problem.
      placeholder: |
        1. Go to 'Trips'
        2. Select 'Tokyo Tech Expedition'
        3. Trigger disruption 'Typhoon alert'
        4. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser version, backend runtime, Python/Node versions.
      placeholder: "macOS 14, Chrome 124, Node v20, Python 3.11"
    validations:
      required: false
